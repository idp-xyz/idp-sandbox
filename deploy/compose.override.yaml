# The sandbox as one more upstream of idp-mcp's development topology (deploy/e2e.sh merges it with
# ../idp-mcp/deploy/compose.yaml). DEV ONLY: it mounts the Docker socket, which is root on the host.
services:
  sandbox:
    image: ${IDP_SANDBOX_IMAGE:-idp-sandbox:dev}
    networks: [upstream]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IDP_CALLER_KEYS:?run deploy/e2e.sh}/gateway.pub:/etc/idp/gateway.pub:ro
      - ${IDP_CALLER_KEYS:?run deploy/e2e.sh}/egress.key:/etc/idp/egress.key:ro
    environment:
      IDP_SANDBOX_LISTEN: 0.0.0.0:8570
      IDP_SANDBOX_PRIVATE_NETWORK: 'true'
      # the caller is the one the gateway signed (D18): the gateway's public key, and this server's endpoint as registered
      IDP_SANDBOX_CALLER_KEYS_FILE: /etc/idp/gateway.pub
      IDP_SANDBOX_CALLER_AUDIENCE: http://sandbox:8570/mcp
      IDP_SANDBOX_METRICS: 0.0.0.0:9570
      IDP_SANDBOX_OWNER: e2e
      IDP_SANDBOX_EGRESS_PROXY: ${IDP_SANDBOX_EGRESS_PROXY:-}   # idp-sandbox-egress with --profile egress
      # with the proxy: each run's proxy URL carries a credential that says the caller's tenant (D21)
      IDP_SANDBOX_EGRESS_KEY_FILE: ${IDP_SANDBOX_EGRESS_PROXY:+/etc/idp/egress.key}
      IDP_SANDBOX_PYTHON_IMAGE: ${IDP_SANDBOX_PYTHON_IMAGE:-ghcr.io/idp-xyz/mirror:public.ecr.aws__docker__library__python__3.12-slim}
      IDP_SANDBOX_SHELL_IMAGE: ${IDP_SANDBOX_SHELL_IMAGE:-ghcr.io/idp-xyz/mirror:public.ecr.aws__docker__library__alpine__3.22}
  registry:
    environment:
      IDP_ALLOWED_UPSTREAM_HOSTS: minimal,reference,sandbox
      IDP_PRIVATE_UPSTREAM_HOSTS: minimal,reference,sandbox
  mcp-gateway:
    environment:
      IDP_GATEWAY_CALLER_KEY_FILE: /etc/idp/caller.key   # signs the caller it forwards (idp-mcp D44)
      # the OAuth clients the gateway serves (idp-mcp ADR-0001 D46), which deploy/e2e.sh writes next to the keys; it replaces the
      # mount idp-mcp's own compose file has at this path, and a gateway that predates the setting ignores the variable
      IDP_GATEWAY_CLIENTS_FILE: /etc/idp/clients.yaml
    volumes:
      - ${IDP_CALLER_KEYS:?run deploy/e2e.sh}/gateway.key:/etc/idp/caller.key:ro
      - ${IDP_CALLER_KEYS:?run deploy/e2e.sh}/gateway-clients.yaml:/etc/idp/clients.yaml:ro
  # OPTIONAL (docker compose --profile egress): the allow-listed egress proxy and the sandbox pointed at it, which
  # adds the network=egress option to sandbox_run (a change of the tool's schema: the gateway pins it, so discover
  # and re-approve the server). IDP_EGRESS_HOSTS is the allow-list (exact names or *.suffix); empty denies all.
  # The proxy takes only runs that show the credential the sandbox made for them (the key the two share, D21), and with
  # IDP_EGRESS_TENANTS (a YAML file on this machine: default: {hosts}, tenants: {<tenant id>: {hosts, ports}}) a tenant
  # named there reaches its own list instead of IDP_EGRESS_HOSTS.
  sandbox-egress:
    profiles: [egress]
    image: ${IDP_SANDBOX_EGRESS_IMAGE:-idp-sandbox-egress:dev}
    container_name: idp-sandbox-egress
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ${IDP_CALLER_KEYS:?run deploy/e2e.sh}/egress.key:/etc/idp/egress.key:ro
      - ${IDP_EGRESS_TENANTS:-/dev/null}:/etc/idp/tenants.yaml:ro
    environment:
      IDP_EGRESS_HOSTS: ${IDP_EGRESS_HOSTS:-}
      IDP_EGRESS_KEY_FILE: /etc/idp/egress.key
      IDP_EGRESS_TENANTS_FILE: /etc/idp/tenants.yaml
