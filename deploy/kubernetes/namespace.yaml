# The service and the code it runs are in different namespaces: the service holds a credential that
# can create Jobs, the runs namespace holds nothing but untrusted pods, volumes and a quota.
apiVersion: v1
kind: Namespace
metadata:
  name: idp-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    idp-mcp/mcp-upstream: "true"      # the idp-mcp gateway may reach upstreams in namespaces carrying this label
---
apiVersion: v1
kind: Namespace
metadata:
  name: idp-sandbox-runs
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
