name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests and isolation tests on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Format, vet, unit tests
        run: make test
      - name: Runtime images
        run: make images
      - name: Isolation tests on real containers (network, fork bomb, memory, disk, symlinks, escapes)
        run: make test-integration
      - name: Image builds
        run: bash deploy/build.sh idp-sandbox:ci

  kubernetes:
    name: the Kubernetes backend on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: tests/kind/kind.yaml
      - name: Calico, so that NetworkPolicies are enforced
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: The backend against a real cluster (hardening, NetworkPolicy, limits, isolation, clean-up)
        run: bash tests/kind/smoke.sh
