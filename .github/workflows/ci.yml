name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests and isolation tests on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Third-party images are named by the mirror (platform releases/mirror-images.yaml), not by their source
        run: |
          if git grep -nE '(public\.ecr\.aws|quay\.io|docker\.io)/|ghcr\.io/(aquasecurity|cloudnative-pg|huggingface)/' -- . ':!*.md' ':!*.sum' | grep -v 'mirror:upstream'; then
            echo "an image is named by its source: use ghcr.io/idp-xyz/mirror:<tag> (python3 tools/mirror_images.py plan, in the platform repository)" >&2; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Format, vet, unit tests
        run: make test
      - name: Runtime images
        run: make images
      - name: Isolation tests on real containers (network, fork bomb, memory, disk, symlinks, escapes)
        run: make test-integration
      - name: Image builds
        run: bash deploy/build.sh idp-sandbox:ci
      - name: Image vulnerabilities (trivy, HIGH and CRITICAL with a fix fail the build)
        run: |
          bash deploy/pull-image.sh ghcr.io/idp-xyz/mirror:ghcr.io__aquasecurity__trivy__0.76.2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/idp-xyz/mirror:ghcr.io__aquasecurity__trivy__0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 idp-sandbox:ci

  kubernetes:
    name: the Kubernetes backend on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: tests/kind/kind.yaml
      - name: Calico, so that NetworkPolicies are enforced
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: The backend against a real cluster (hardening, NetworkPolicy, limits, isolation, clean-up)
        run: bash tests/kind/smoke.sh
      - name: Files of any content in and out of a workspace, as the service account with its Role and quota (D19)
        run: bash tests/kind/transfer.sh
      - name: Egress on the Kubernetes backend, per tenant, through the proxy and nothing around it (D22)
        run: bash tests/kind/egress.sh
