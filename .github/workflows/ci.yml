name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests and isolation tests on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Format, vet, unit tests
        run: make test
      - name: Isolation tests on real containers (network, fork bomb, memory, disk, symlinks, escapes)
        run: make test-integration
      - name: Image builds
        run: bash deploy/build.sh idp-sandbox:ci
