# kind without its default CNI: Calico enforces the NetworkPolicies (kindnet did not stop a run pod from reaching
# the internet in the CI cluster, so it cannot be the proof that the policies hold).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
